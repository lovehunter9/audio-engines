# audio-melband-ov. OpenVINO GPU, amd64.
name: melband-ov-ci

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'wrapper/**'
      - 'tests/**'
      - 'bases/melbandov/**'
      - '.github/workflows/melband-ov-ci.yml'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Docker Hub namespace'
        required: false
        default: beclab
      image_tag:
        description: 'Image tag to publish. Empty publishes only when the ref is main or a v* tag.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: melband-ov-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      base: melbandov
      repo: audio-melband-ov
      slices: '[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"}]'
      namespace: ${{ inputs.namespace || github.repository_owner }}
      image_tag: ${{ inputs.image_tag || '' }}
    secrets: inherit
