# Shared slim CUDA+torch floor. Not an engine; families FROM this image.
name: runtime-ci

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'bases/runtime/**'
      - '.github/workflows/runtime-ci.yml'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Docker Hub namespace'
        required: false
        default: beclab
      image_tag:
        description: 'Explicit tag for a dev build (empty = only main/v* refs publish)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      base: runtime
      repo: audio-runtime
      namespace: ${{ inputs.namespace || 'beclab' }}
      image_tag: ${{ inputs.image_tag || '' }}
    secrets: inherit
