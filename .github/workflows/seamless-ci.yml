name: seamless-ci

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'wrapper/**'
      - 'tests/**'
      - 'bases/seamless/**'
      - 'bases/seamlessxpu/**'
      - 'bases/runtime/**'
      - '.github/workflows/seamless-ci.yml'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Docker Hub namespace'
        required: false
        default: beclab
      image_tag:
        description: 'Explicit tag for a dev build (empty = only main/v* refs publish)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: seamless-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      base: seamless
      repo: audio-seamless
      slices: '[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"}]'
      namespace: ${{ inputs.namespace || github.repository_owner }}
      image_tag: ${{ inputs.image_tag || '' }}
    secrets: inherit
  build-intel:
    uses: ./.github/workflows/build-image.yml
    with:
      base: seamlessxpu
      repo: audio-seamless-xpu
      slices: '[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"}]'
      namespace: ${{ inputs.namespace || github.repository_owner }}
      image_tag: ${{ inputs.image_tag || '' }}
    secrets: inherit
