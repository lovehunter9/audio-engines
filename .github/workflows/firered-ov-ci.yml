# FireRedTTS3-Instruct Intel OpenVINO CI (image audio-firered-ov). Triggers only; build is build-image.yml.
# Parked 2026-09-20: Intel TTS 适配暂跳过。代码保留；自动触发关掉，只留手动。
name: firered-ov-ci

on:
  # push:
  #   tags: ['v*']
  # pull_request:
  #   paths:
  #     - 'wrapper/**'
  #     - 'tests/**'
  #     - 'bases/fireredov/**'
  #     - '.github/workflows/firered-ov-ci.yml'
  #     - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Docker Hub namespace'
        required: false
        default: beclab
      image_tag:
        description: 'Explicit tag for a dev build (empty = only main/v* refs publish)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: firered-ov-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      base: fireredov
      repo: audio-firered-ov
      slices: '[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"}]'
      namespace: ${{ inputs.namespace || 'beclab' }}
      image_tag: ${{ inputs.image_tag || '' }}
    secrets: inherit
