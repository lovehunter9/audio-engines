# qwen audio base image CI. Mirrors llm-gateway backend-ci's docker-build job:
# push to main / v* tag / workflow_dispatch publishes to Docker Hub; PRs build
# only (forks have no secrets). Local dev builds the SAME Dockerfile by hand and
# pushes to a personal registry (see Makefile) — no separate dev build path.
name: qwen-ci

on:
  push:
    branches: [main]
    paths:
      - 'wrapper/**'
      - 'bases/qwen/**'
      - '.github/workflows/qwen-ci.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'wrapper/**'
      - 'bases/qwen/**'
      - '.github/workflows/qwen-ci.yml'
  # Dev builds: dispatch from any branch and publish to your own namespace —
  # namespace=<ns> + image_tag=<tag> publishes <ns>/audio-qwen:<tag>. Leave
  # image_tag empty for the normal main/tag publishing rules.
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Docker Hub namespace'
        required: false
        default: beclab
      image_tag:
        description: 'Explicit tag for a dev build (empty = main/tag rules)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: qwen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: byte-compile wrapper
        run: python -m compileall -q wrapper
      - name: ruff (non-blocking style)
        run: |
          python -m pip install -q ruff
          ruff check wrapper || true

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The vLLM CUDA base alone is ~10 GB compressed / 20 GB+ unpacked, which
      # does not fit next to the runner's preinstalled toolchains.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Image namespace HARDCODED to beclab/audio-qwen (Docker Hub org). NOT
      # derived from DOCKERHUB_USERNAME: the secret is the LOGIN identity (a
      # personal account with push permission to the org); the namespace is the
      # publishing destination.
      - name: compute image metadata
        id: meta
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_NAMESPACE: ${{ inputs.namespace || 'beclab' }}
          DH_REPO: audio-qwen
          DEV_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHORT_SHA=${GITHUB_SHA::7}
          IMAGE="${DH_NAMESPACE}/${DH_REPO}"
          if [ -n "${DEV_TAG:-}" ]; then
            if [ -z "${DH_USER:-}" ]; then
              echo "::error::DOCKERHUB_USERNAME secret is empty; cannot log in to Docker Hub"; exit 1
            fi
            {
              echo "build_date=${BUILD_DATE}"
              echo "push=true"
              echo "version=${DEV_TAG}"
              echo "tags=${IMAGE}:${DEV_TAG}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IS_MAIN=false; IS_TAG=false; TAG_NAME=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.ref }}" in
              refs/heads/main) IS_MAIN=true ;;
              refs/tags/v*) IS_TAG=true; TAG_NAME="${GITHUB_REF#refs/tags/}" ;;
            esac
          fi
          SHOULD_PUSH=false
          if [ "$IS_MAIN" = "true" ] || [ "$IS_TAG" = "true" ]; then SHOULD_PUSH=true; fi
          {
            echo "build_date=${BUILD_DATE}"
            echo "push=${SHOULD_PUSH}"
            if [ "$SHOULD_PUSH" = "true" ]; then
              if [ -z "${DH_USER:-}" ]; then
                echo "::error::DOCKERHUB_USERNAME secret is empty; cannot log in to Docker Hub"; exit 1
              fi
              if [ "$IS_TAG" = "true" ]; then
                echo "version=${TAG_NAME}"
                echo "tags<<EOF"
                case "$TAG_NAME" in *-*) : ;; *) echo "${IMAGE}:latest" ;; esac
                echo "${IMAGE}:${TAG_NAME}"
                echo "${IMAGE}:sha-${SHORT_SHA}"
                echo "EOF"
              else
                echo "version=sha-${SHORT_SHA}"
                echo "tags<<EOF"
                echo "${IMAGE}:latest"
                echo "${IMAGE}:sha-${SHORT_SHA}"
                echo "EOF"
              fi
            else
              echo "version=ci-${SHORT_SHA}"
              echo "tags=${DH_REPO}:ci-${SHORT_SHA}"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: log in to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      # No type=gha cache: these layers dwarf the 10 GB per-repo cache limit, so
      # caching only thrashes it, and pulling the base on a runner is fast.
      - name: docker build (push on main / tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bases/qwen/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          # Plain image, no attestation index — same shape as the local build.
          provenance: false
