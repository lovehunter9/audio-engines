# qwen audio base image CI. Triggers + path filters live here; the build itself
# is the shared build-image workflow.
name: qwen-ci

on:
  push:
    branches: [main]
    paths:
      - 'wrapper/**'
      - 'bases/qwen/**'
      - '.github/workflows/qwen-ci.yml'
      - '.github/workflows/build-image.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'wrapper/**'
      - 'bases/qwen/**'
      - '.github/workflows/qwen-ci.yml'
      - '.github/workflows/build-image.yml'
  # Dev builds: dispatch from any branch and publish to your own namespace —
  # namespace=<ns> + image_tag=<tag> publishes <ns>/audio-qwen:<tag>. Leave
  # image_tag empty for the normal main/tag publishing rules.
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Docker Hub namespace'
        required: false
        default: beclab
      image_tag:
        description: 'Explicit tag for a dev build (empty = main/tag rules)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: qwen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      base: qwen
      repo: audio-qwen
      namespace: ${{ inputs.namespace || 'beclab' }}
      image_tag: ${{ inputs.image_tag || '' }}
    secrets: inherit
