# qwen3voice CI: dev images only. Dispatch on the fork; do not publish to beclab from here.
name: qwen3voice-ci

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Docker Hub namespace'
        required: false
        default: lovehunter9
      image_tag:
        description: 'Explicit tag for a dev build (empty = only main/v* refs publish)'
        required: false
        default: ''
      slices:
        description: 'Arch slices JSON. Empty builds amd64 and arm64.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: qwen3voice-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      base: qwen3voice
      repo: audio-qwen3voice
      namespace: ${{ inputs.namespace || github.repository_owner }}
      image_tag: ${{ inputs.image_tag || '' }}
      slices: ${{ inputs.slices || '[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"},{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]' }}
    secrets: inherit
