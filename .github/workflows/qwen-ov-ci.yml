# Qwen OpenVINO CI (image audio-qwen-ov). Triggers only; build is build-image.yml.
name: qwen-ov-ci

on:
  # Publishes are deliberate: a v* tag builds every base (no path filter can skip it), or dispatch.
  push:
    tags: ['v*']
  # A PR ref publishes nothing: the run is the contract and smoke tests that gate main.
  pull_request:
    paths:
      - 'wrapper/**'
      - 'tests/**'
      - 'bases/ov/**'
      - 'scripts/deps-image.sh'
      - 'scripts/vendor-image.sh'
      - '.github/workflows/qwen-ov-ci.yml'
      - '.github/workflows/ov-vendor-ci.yml'
      - '.github/workflows/build-image.yml'
  # Dev: dispatch namespace + image_tag to publish; an empty tag publishes only from main or v*.
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Docker Hub namespace'
        required: false
        default: beclab
      image_tag:
        description: 'Explicit tag for a dev build (empty = only main/v* refs publish)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: qwen-ov-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      base: ov
      repo: audio-qwen-ov
      # Intel GPU (iGPU and Arc) is x86_64; there is no arm64 OpenVINO GPU plugin we would ship.
      slices: '[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"}]'
      namespace: ${{ inputs.namespace || 'beclab' }}
      image_tag: ${{ inputs.image_tag || '' }}
    secrets: inherit
