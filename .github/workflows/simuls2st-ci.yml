name: simuls2st-ci

on:
  push:
    tags: ['v*', 'simuls2st-cuda-*']
  pull_request:
    paths:
      - 'wrapper/**'
      - 'tests/**'
      - 'bases/simuls2st/**'
      - 'bases/runtime/**'
      - '.github/workflows/simuls2st-ci.yml'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Docker Hub namespace'
        required: false
        default: beclab
      image_tag:
        description: 'Explicit tag for a dev build (empty = only main/v* refs publish)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: simuls2st-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      base: simuls2st
      repo: audio-simuls2st
      slices: '[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"},{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
      namespace: ${{ inputs.namespace || github.repository_owner }}
      image_tag: ${{ inputs.image_tag || (startsWith(github.ref, 'refs/tags/simuls2st-cuda-') && github.ref_name) || '' }}
    secrets: inherit
