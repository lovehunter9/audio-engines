# breeze CI: triggers only; the build is the shared build-image.yml.
name: breeze-ci

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'wrapper/**'
      - 'tests/**'
      - 'bases/breeze/**'
      - '.github/workflows/breeze-ci.yml'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Docker Hub namespace'
        required: false
        default: beclab
      image_tag:
        description: 'Explicit tag for a dev build (empty = only main/v* refs publish)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: breeze-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      base: breeze
      repo: audio-breeze
      namespace: ${{ inputs.namespace || 'beclab' }}
      image_tag: ${{ inputs.image_tag || '' }}
    secrets: inherit
