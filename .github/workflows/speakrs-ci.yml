# speakrs CI: triggers only; the build is the shared build-image.yml.
name: speakrs-ci

on:
  # Publishes are deliberate: a v* tag builds every base (no path filter can skip it), or dispatch.
  push:
    tags: ['v*']
  # A PR ref publishes nothing: the run is the contract and smoke tests that gate main.
  pull_request:
    paths:
      - 'wrapper/**'
      - 'tests/**'
      - 'bases/speakrs/**'
      - '.github/workflows/speakrs-ci.yml'
      - '.github/workflows/build-image.yml'
  # Dev: dispatch namespace + image_tag to publish; an empty tag publishes only from main or v*.
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Docker Hub namespace'
        required: false
        default: beclab
      image_tag:
        description: 'Explicit tag for a dev build (empty = only main/v* refs publish)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: speakrs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      base: speakrs
      repo: audio-speakrs
      # Still amd64 only, and the reason has moved. ONNX Runtime does publish no aarch64 CUDA
      # release, but that half is now built from source, so the engine itself is no longer the
      # blocker. What blocks it is bases/speakrs/deps.Dockerfile pinning an ENGINE_IMAGE digest
      # that resolves for amd64 alone: with both slices enabled, the arm64 job fails at FROM.
      #
      # Remove this line when that digest points at an index carrying both architectures, and not
      # before -- the two changes are one change, and doing this half first turns the arm64 job red
      # without telling anyone why.
      slices: '[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"}]'
      namespace: ${{ inputs.namespace || 'beclab' }}
      image_tag: ${{ inputs.image_tag || '' }}
    secrets: inherit
