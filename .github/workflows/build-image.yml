# Shared multi-arch build (amd64+arm64). Never put "<namespace>/..." in job outputs — Actions secret-scan drops them when namespace==DOCKERHUB_USERNAME.
name: build-image

on:
  workflow_call:
    inputs:
      base:
        description: 'Base directory under bases/'
        required: true
        type: string
      repo:
        description: 'Docker Hub repository name (without namespace)'
        required: true
        type: string
      namespace:
        description: 'Docker Hub namespace to publish to'
        required: false
        default: beclab
        type: string
      image_tag:
        description: 'Explicit tag for a dev build (empty = only main/v* refs publish)'
        required: false
        default: ''
        type: string
      slices:
        description: 'Arch slices to build, as JSON [{arch, platform, runner}]. Default builds both.'
        required: false
        default: '[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"},{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The images run newer, but 3.10 is the floor the wrapper is written to (`X | Y`
          # annotations in caps/tts_el.py); linting below pins the same floor.
          python-version: '3.11'
      - name: install test dependencies
        # onnx is here for the same reason ffmpeg is below: without it the OpenVINO
        # model-derivation case returns early and its assertions never run, while the
        # suite still prints that everything passed.
        #
        # 🔴 Pinned to the version bases/speakrs-ov/deps.Dockerfile installs, which is what
        # that file's comment already claims ("the image and the check agree"). Unpinned they
        # drift in silence and in either direction: a release that tightens infer_shapes or
        # the checker fails this job against a version no image runs, or passes it on
        # behaviour no image has. test_contract.py asserts the two stay equal.
        #
        # 🔴 soundfile for the same reason a third time, and it was the most expensive of
        # the three. Without it `align._calibrate` dies at its own `import soundfile`
        # before it reaches the warm-up call, so every assertion about what a failed
        # warm-up does was being made about a failed import -- and `audioio.probe_seconds`
        # falls back to the standard library's `wave`, so tests/test_audio_readers.py, the
        # whole point of which is that the two readers disagree about which containers they
        # can measure, was running against one reader. Both printed pass.
        run: python -m pip install -q fastapi httpx numpy onnx==1.22.0 python-multipart soundfile uvicorn
      - name: install ffmpeg
        # The tempo assertions for FireRed/Breeze long text shell out to ffmpeg, and skipped
        # themselves on every run without it -- on the one path where a wrong filter chain is
        # audible rather than an exception. ffprobe comes with it, which is what the upload
        # duration bound falls back to.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: byte-compile wrapper and tests
        run: python -m compileall -q wrapper tests
      - name: contract tests
        run: python -m unittest tests/test_contract.py
      # 🔴 Until here CI ran no unit tests at all. A branch could add a hundred of them, go
      # green, and have none of them guarding anything. discover is a superset of the contract
      # step above, kept separate so a contract failure keeps its own name in the checks list.
      - name: unit tests
        run: python -m unittest discover -s tests
      - name: capability smoke tests
        run: python tests/caps_smoke.py
      - name: watchdog smoke tests
        run: python tests/watchdog_smoke.py
      - name: ruff
        # Pinned: the rule set is selected in ruff.toml, but which checks a family contains
        # still moves between releases, and a lint that starts failing on a version bump is a
        # lint people go back to ignoring.
        run: |
          python -m pip install -q ruff==0.16.6
          ruff check wrapper tests

  meta:
    name: meta
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
      push: ${{ steps.meta.outputs.push }}
      version: ${{ steps.meta.outputs.version }}
      # Tag NAMES only (no namespace/repo) — safe for job outputs.
      tag_names: ${{ steps.meta.outputs.tag_names }}
      kind: ${{ steps.method.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - name: pick build method
        id: method
        run: |
          if [ -f "bases/${{ inputs.base }}/append.env" ]; then
            echo "kind=append" >> "$GITHUB_OUTPUT"
          else
            echo "kind=docker" >> "$GITHUB_OUTPUT"
          fi
      - name: compute image metadata
        id: meta
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DEV_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHORT_SHA=${GITHUB_SHA::7}
          if [ -n "${DEV_TAG:-}" ]; then
            if [ -z "${DH_USER:-}" ]; then
              echo "::error::DOCKERHUB_USERNAME secret is empty; cannot log in to Docker Hub"; exit 1
            fi
            {
              echo "build_date=${BUILD_DATE}"
              echo "push=true"
              echo "version=${DEV_TAG}"
              echo "tag_names=${DEV_TAG}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IS_MAIN=false; IS_TAG=false; TAG_NAME=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.ref }}" in
              refs/heads/main) IS_MAIN=true ;;
              refs/tags/v*) IS_TAG=true; TAG_NAME="${GITHUB_REF#refs/tags/}" ;;
            esac
          fi
          SHOULD_PUSH=false
          if [ "$IS_MAIN" = "true" ] || [ "$IS_TAG" = "true" ]; then SHOULD_PUSH=true; fi
          {
            echo "build_date=${BUILD_DATE}"
            echo "push=${SHOULD_PUSH}"
            if [ "$SHOULD_PUSH" = "true" ]; then
              if [ -z "${DH_USER:-}" ]; then
                echo "::error::DOCKERHUB_USERNAME secret is empty; cannot log in to Docker Hub"; exit 1
              fi
              if [ "$IS_TAG" = "true" ]; then
                echo "version=${TAG_NAME}"
                echo "tag_names<<EOF"
                case "$TAG_NAME" in *-*) : ;; *) echo "latest" ;; esac
                echo "${TAG_NAME}"
                echo "sha-${SHORT_SHA}"
                echo "EOF"
              else
                echo "version=sha-${SHORT_SHA}"
                echo "tag_names<<EOF"
                echo "latest"
                echo "sha-${SHORT_SHA}"
                echo "EOF"
              fi
            else
              echo "version=ci-${SHORT_SHA}"
              echo "tag_names=ci-${SHORT_SHA}"
            fi
          } >> "$GITHUB_OUTPUT"

  docker-build:
    name: docker-build (${{ matrix.arch }})
    needs: [lint, meta]
    if: needs.meta.outputs.push == 'true'
    strategy:
      fail-fast: false
      # A single-arch base says so in `slices`; the default is both, so existing callers are unchanged.
      matrix:
        include: ${{ fromJSON(inputs.slices) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: install crane
        env:
          CRANE_VERSION: v0.20.3
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) CRANE_ARCH=x86_64 ;;
            aarch64|arm64) CRANE_ARCH=arm64 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: does this base's deps image exist for this arch
        id: deps
        if: needs.meta.outputs.kind == 'append'
        env:
          DH_NAMESPACE: ${{ inputs.namespace }}
          DH_REPO: ${{ inputs.repo }}
          WANT_PLATFORM: ${{ matrix.platform }}
          WANT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # crane digest --platform linux/arm64 on a single-arch amd64 image still returns a digest — always verify config.architecture matches WANT_ARCH.
          arch_matches() {
            local ref="$1"
            local got
            got="$(crane config --platform "$WANT_PLATFORM" "$ref" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("architecture",""))' \
              || true)"
            [ "$got" = "$WANT_ARCH" ]
          }
          if [ ! -f "bases/${{ inputs.base }}/deps.Dockerfile" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "base_image=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUNTIME_REPO="${DH_NAMESPACE}/${DH_REPO}"
          IMG=$(./scripts/deps-image.sh "${{ inputs.base }}" "$RUNTIME_REPO")
          ARCH_IMG="${IMG}-${WANT_ARCH}"
          # Keep full refs in STEP outputs only (same job). Job outputs must not embed the namespace.
          echo "base_image=${ARCH_IMG}" >> "$GITHUB_OUTPUT"
          echo "merged_deps=${IMG}" >> "$GITHUB_OUTPUT"
          if crane manifest "$ARCH_IMG" >/dev/null 2>&1 && arch_matches "$ARCH_IMG"; then
            echo "$ARCH_IMG is already published (${WANT_ARCH}); appending the wrapper onto it"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif crane digest --platform "$WANT_PLATFORM" "$IMG" >/dev/null 2>&1 && arch_matches "$IMG"; then
            echo "$IMG already has real ${WANT_PLATFORM}; reusing it as the base"
            echo "base_image=${IMG}" >> "$GITHUB_OUTPUT"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$ARCH_IMG missing or wrong arch: building deps for ${WANT_PLATFORM}"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: make room for the image
        if: needs.meta.outputs.kind == 'docker' || steps.deps.outputs.needed == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup \
                      /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell \
                      /usr/share/miniconda /usr/lib/jvm /usr/local/lib/node_modules \
                      /usr/local/share/vcpkg /usr/local/graalvm /opt/az /opt/google || true
          sudo apt-get clean || true
          docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3
        if: needs.meta.outputs.kind == 'docker' || steps.deps.outputs.needed == 'true'

      # Hub vendor (pip + genai clone) is the real cache. GHA layer cache
      # alone is not: a patch COPY in the same RUN as pip still rebuilds cold.
      - name: resolve vendor image
        id: vendor
        if: steps.deps.outputs.needed == 'true'
        env:
          DH_NAMESPACE: ${{ inputs.namespace }}
          DH_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          if [ ! -f "bases/${{ inputs.base }}/vendor.Dockerfile" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "build_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUNTIME_REPO="${DH_NAMESPACE}/${DH_REPO}"
          VENDOR=$(./scripts/vendor-image.sh "${{ inputs.base }}" "$RUNTIME_REPO" vendor)
          OVBASE=$(./scripts/vendor-image.sh "${{ inputs.base }}" "$RUNTIME_REPO" ovbase)
          echo "vendor=${VENDOR}" >> "$GITHUB_OUTPUT"
          echo "ovbase=${OVBASE}" >> "$GITHUB_OUTPUT"
          {
            echo "build_args<<EOF"
            echo "VENDOR=${VENDOR}"
            echo "BASE=${OVBASE}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          missing=""
          crane manifest "$VENDOR" >/dev/null 2>&1 || missing="$missing $VENDOR"
          crane manifest "$OVBASE" >/dev/null 2>&1 || missing="$missing $OVBASE"
          if [ -n "$missing" ]; then
            echo "::error::vendor not on Hub:$missing — run ov-vendor-ci by hand (workflow_dispatch only). qwen-ov-ci must not build vendor on a tag."
            exit 1
          fi
          echo "needed=false" >> "$GITHUB_OUTPUT"
          echo "vendor ${VENDOR} ovbase ${OVBASE} (Hub, not built here)"

      - name: build the deps image for this arch
        if: steps.deps.outputs.needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bases/${{ inputs.base }}/deps.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.deps.outputs.base_image }}
          provenance: false
          build-args: ${{ steps.vendor.outputs.build_args }}
          cache-from: type=gha,scope=deps-${{ inputs.base }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=deps-${{ inputs.base }}-${{ matrix.arch }}

      # 🔴 Here, not in `make deps`, because this workflow never runs make. It computes the
      # deps tag with scripts/deps-image.sh and builds with build-push-action, so a check
      # hanging off the Makefile target runs only when a person types it -- and the drift it
      # guards against happens on a CI rebuild, which is the one path that skipped it.
      #
      # The hazard is specific: deps.Dockerfile installs `qwen-asr` with no version, so the
      # package resolves afresh whenever the recipe's hash changes, while align.py carries a
      # hand-copied word splitter from it. A copy that has drifted raises nothing; it starts
      # segmenting differently.
      #
      # ⚠️ Runs on whichever slice this runner is, so the matrix checks both architectures --
      # one more than `make check-units` on a developer's machine ever did.
      - name: the copied word splitter still matches the library in the deps image
        if: needs.meta.outputs.kind == 'append' && inputs.base == 'qwen'
        env:
          DEPS_IMAGE: ${{ steps.deps.outputs.base_image }}
        run: |
          set -euo pipefail
          test -n "${DEPS_IMAGE}" || { echo "::error::no deps image to check against"; exit 1; }
          # 🔴 Room first, and this step has to ask for it itself. The cleanup above runs
          # only for `kind == docker` or when the deps image had to be BUILT -- and the
          # normal append path is neither: the image is already published, which is why
          # crane appends onto it instead. crane never pulls it into the daemon, so this
          # `docker run` is the first thing on the runner to fetch several gigabytes of
          # CUDA torch, on a disk sized for a job that was not going to.
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup \
                      /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell \
                      /usr/share/miniconda /usr/lib/jvm || true
          docker run --rm -v "$PWD:/src:ro" -w /src "${DEPS_IMAGE}" \
            python3 scripts/check-units-against-upstream.py

      - name: docker build (single-arch slice)
        if: needs.meta.outputs.kind == 'docker'
        env:
          DH_NAMESPACE: ${{ inputs.namespace }}
          DH_REPO: ${{ inputs.repo }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            -f "bases/${{ inputs.base }}/Dockerfile" \
            -t "${DH_NAMESPACE}/${DH_REPO}:${VERSION}-${{ matrix.arch }}" \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "COMMIT=${{ github.sha }}" \
            --build-arg "BUILD_DATE=${{ needs.meta.outputs.build_date }}" \
            --provenance=false \
            --push .

      - name: crane append (single-arch slice)
        if: needs.meta.outputs.kind == 'append'
        env:
          BASE: ${{ inputs.base }}
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ needs.meta.outputs.build_date }}
          PLATFORM: ${{ matrix.platform }}
          DH_NAMESPACE: ${{ inputs.namespace }}
          DH_REPO: ${{ inputs.repo }}
          TAG_NAMES: ${{ needs.meta.outputs.tag_names }}
          DEPS_BASE: ${{ steps.deps.outputs.base_image }}
        run: |
          set -euo pipefail
          if [ -n "${DEPS_BASE:-}" ]; then
            export BASE_IMAGE="$DEPS_BASE"
          fi
          count=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            IMAGE="${DH_NAMESPACE}/${DH_REPO}:${name}-${{ matrix.arch }}"
            echo "appending wrapper -> $IMAGE (platform=$PLATFORM)"
            IMAGE="$IMAGE" PLATFORM="$PLATFORM" ./scripts/append-image.sh
            count=$((count + 1))
          done <<< "$TAG_NAMES"
          if [ "$count" -eq 0 ]; then
            echo "::error::no tag names to append (meta.tag_names empty?)"
            exit 1
          fi

  merge-manifests:
    name: merge-manifests
    needs: [meta, docker-build]
    if: needs.meta.outputs.push == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: install crane
        env:
          CRANE_VERSION: v0.20.3
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: merge runtime tags into multi-arch indexes
        env:
          DH_NAMESPACE: ${{ inputs.namespace }}
          DH_REPO: ${{ inputs.repo }}
          TAG_NAMES: ${{ needs.meta.outputs.tag_names }}
          ARCHES: ${{ join(fromJSON(inputs.slices).*.arch, ' ') }}
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            tag="${DH_NAMESPACE}/${DH_REPO}:${name}"
            echo "indexing $tag over: $ARCHES"
            # Unquoted on purpose: ARCHES is a word list.
            ./scripts/merge-index.sh "$tag" $ARCHES
            count=$((count + 1))
          done <<< "$TAG_NAMES"
          if [ "$count" -eq 0 ]; then
            echo "::error::no tag names to merge (meta.tag_names empty?)"
            exit 1
          fi

      - name: merge deps tags into multi-arch index
        if: needs.meta.outputs.kind == 'append'
        env:
          DH_NAMESPACE: ${{ inputs.namespace }}
          DH_REPO: ${{ inputs.repo }}
          ARCHES: ${{ join(fromJSON(inputs.slices).*.arch, ' ') }}
        run: |
          set -euo pipefail
          if [ ! -f "bases/${{ inputs.base }}/deps.Dockerfile" ]; then
            echo "no deps.Dockerfile; skip"
            exit 0
          fi
          RUNTIME_REPO="${DH_NAMESPACE}/${DH_REPO}"
          IMG=$(./scripts/deps-image.sh "${{ inputs.base }}" "$RUNTIME_REPO")
          missing=""
          for arch in $ARCHES; do
            crane manifest "${IMG}-${arch}" >/dev/null 2>&1 || missing="$missing $arch"
          done
          if [ -z "$missing" ]; then
            # Unquoted on purpose: ARCHES is a word list.
            ./scripts/merge-index.sh "$IMG" $ARCHES
          else
            echo "per-arch deps missing for:$missing (may have reused a prior multi-arch $IMG); ok"
          fi
