# Shared build for every base image, called by the per-base <base>-ci.yml (which
# owns the triggers and path filters). Mirrors llm-gateway backend-ci's
# docker-build job: push to main / v* tag / workflow_dispatch publishes to Docker
# Hub; PRs build only (forks have no secrets). Local dev builds the SAME
# Dockerfile by hand and pushes to a personal registry (see Makefile) — no
# separate dev build path.
name: build-image

on:
  workflow_call:
    inputs:
      base:
        description: 'Base directory under bases/'
        required: true
        type: string
      repo:
        description: 'Docker Hub repository name (without namespace)'
        required: true
        type: string
      namespace:
        description: 'Docker Hub namespace to publish to'
        required: false
        default: beclab
        type: string
      image_tag:
        description: 'Explicit tag for a dev build (empty = main/tag rules)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: byte-compile wrapper
        run: python -m compileall -q wrapper
      - name: ruff (non-blocking style)
        run: |
          python -m pip install -q ruff
          ruff check wrapper || true

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CUDA bases are tens of GB unpacked and the runner has ONE ~72 GB
      # filesystem — /mnt is a directory on it, not a second disk, so relocating
      # Docker there frees nothing. The only real room comes from deleting the
      # preinstalled toolchains and the runner's cached images. Must run BEFORE
      # buildx starts, since the builder stores everything in /var/lib/docker.
      - name: make room for the image
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup \
                      /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell \
                      /usr/share/miniconda /usr/lib/jvm /usr/local/lib/node_modules \
                      /usr/local/share/vcpkg /usr/local/graalvm /opt/az /opt/google
          sudo apt-get clean
          docker image prune -af
          df -h /

      # The namespace is the publishing DESTINATION and is NOT derived from
      # DOCKERHUB_USERNAME, which is the LOGIN identity (a personal account with
      # push permission to the org).
      - name: compute image metadata
        id: meta
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_NAMESPACE: ${{ inputs.namespace }}
          DH_REPO: ${{ inputs.repo }}
          DEV_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHORT_SHA=${GITHUB_SHA::7}
          IMAGE="${DH_NAMESPACE}/${DH_REPO}"
          if [ -n "${DEV_TAG:-}" ]; then
            if [ -z "${DH_USER:-}" ]; then
              echo "::error::DOCKERHUB_USERNAME secret is empty; cannot log in to Docker Hub"; exit 1
            fi
            {
              echo "build_date=${BUILD_DATE}"
              echo "push=true"
              echo "version=${DEV_TAG}"
              echo "tags=${IMAGE}:${DEV_TAG}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IS_MAIN=false; IS_TAG=false; TAG_NAME=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.ref }}" in
              refs/heads/main) IS_MAIN=true ;;
              refs/tags/v*) IS_TAG=true; TAG_NAME="${GITHUB_REF#refs/tags/}" ;;
            esac
          fi
          SHOULD_PUSH=false
          if [ "$IS_MAIN" = "true" ] || [ "$IS_TAG" = "true" ]; then SHOULD_PUSH=true; fi
          {
            echo "build_date=${BUILD_DATE}"
            echo "push=${SHOULD_PUSH}"
            if [ "$SHOULD_PUSH" = "true" ]; then
              if [ -z "${DH_USER:-}" ]; then
                echo "::error::DOCKERHUB_USERNAME secret is empty; cannot log in to Docker Hub"; exit 1
              fi
              if [ "$IS_TAG" = "true" ]; then
                echo "version=${TAG_NAME}"
                echo "tags<<EOF"
                case "$TAG_NAME" in *-*) : ;; *) echo "${IMAGE}:latest" ;; esac
                echo "${IMAGE}:${TAG_NAME}"
                echo "${IMAGE}:sha-${SHORT_SHA}"
                echo "EOF"
              else
                echo "version=sha-${SHORT_SHA}"
                echo "tags<<EOF"
                echo "${IMAGE}:latest"
                echo "${IMAGE}:sha-${SHORT_SHA}"
                echo "EOF"
              fi
            else
              echo "version=ci-${SHORT_SHA}"
              echo "tags=${DH_REPO}:ci-${SHORT_SHA}"
            fi
          } >> "$GITHUB_OUTPUT"

      # Before setup-buildx, which pulls moby/buildkit: an anonymous pull of it
      # times out when several bases build at once, an authenticated one doesn't.
      - name: log in to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - uses: docker/setup-buildx-action@v3

      # No type=gha cache: these layers dwarf the 10 GB per-repo cache limit, so
      # caching only thrashes it, and pulling the base on a runner is fast.
      - name: docker build (push on main / tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bases/${{ inputs.base }}/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          # Plain image, no attestation index — same shape as the local build.
          provenance: false
