name: s3-s2st-ov-ci

on:
  push:
    tags: ['s3-s2st-ov-*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag
        required: true

permissions:
  contents: read

concurrency:
  group: s3-s2st-ov-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASS }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bases/s3s2stov/deps.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ github.repository_owner }}/audio-s3-s2st-ov-deps:${{ inputs.image_tag || github.ref_name }}
          cache-from: type=gha,scope=s3s2stov-deps
          cache-to: type=gha,mode=max,scope=s3s2stov-deps
